name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Install build dependency
        run: python -m pip install -r requirements-ide.txt
      - name: Run test suite
        run: python -m unittest discover -s tests -v
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c "import os; from version import __version__; tag = os.environ['RELEASE_TAG']; assert tag == f'v{__version__}', f'{tag} does not match v{__version__}'"
      - name: Build installer
        run: python scripts/build_installer.py
      - uses: actions/upload-artifact@v4
        with:
          name: Hangullo-Windows-Installer
          path: dist/Hangullo-*-Setup.exe
          if-no-files-found: error